name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: coverage
          path: coverage/

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mfs-stock:${{ github.sha }} .
      - name: Smoke test du conteneur
        run: |
          docker run -d --name smoke -p 3001:3001 -e JWT_SECRET=ci-secret mfs-stock:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs http://localhost:3001/api/health && exit 0; sleep 2; done
          docker logs smoke; exit 1

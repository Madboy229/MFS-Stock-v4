<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Produits - MFS SARL</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.products-page {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('product.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            margin: 2rem auto;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .card {
            background: rgba(255, 255, 255, 0.98) !important;
            backdrop-filter: blur(10px);
        }
        
        .table-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        /* Bouton de déconnexion en rouge */
        .nav-links li a[onclick="logout()"] {
            background-color: #e74c3c !important;
            color: white !important;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            text-decoration: none !important;
            transition: background-color 0.3s ease;
        }
        
        .nav-links li a[onclick="logout()"]:hover {
            background-color: #c0392b !important;
        }
    </style>
</head>
<body class="products-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">MFS SARL</a></div>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="products.html">Produits</a></li>
                <li><a href="history.html">Historique</a></li>
                <li><a href="profile.html">Profil</a></li>
                <li><a href="#" onclick="logout()">Déconnexion</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 style="color: var(--bleu);">Gestion des Produits</h1>
            <button class="btn btn-success" onclick="showProductModal()">Ajouter Produit</button>
        </div>

        <div class="card">
            <div class="table-container">
                <table id="products-table">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Catégorie</th>
                            <th>Unité</th>
                            <th>Stock Min</th>
                            <th>Stock Actuel</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody">
                        <tr>
                            <td colspan="6" style="text-align: center;">Chargement...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
